<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design-system part preview</title>
<link rel="stylesheet" href="fonts/open-sans.css">
<link rel="stylesheet" href="../../inst/assets/css/blockr-tokens.css">
<link rel="stylesheet" href="../../inst/assets/css/blockr-tokens-dark.css">
<link rel="stylesheet" href="ds-page.css">
</head>
<body>
<div class="wrap" id="out"></div>
<script>
// Preview one fragment: part.html?p=gear loads parts/gear.html (and the shared icon sprite).
const p = new URLSearchParams(location.search).get('p');
if (new URLSearchParams(location.search).get('dark')) document.documentElement.setAttribute('data-bs-theme', 'dark');
Promise.all([fetch('parts/_icons.svg.html?' + Date.now()).then(r => r.text()), fetch('parts/' + p + '.html?' + Date.now()).then(r => r.text())])
  .then(([icons, html]) => { document.getElementById('out').innerHTML = icons + html; });
</script>
</body>
</html>
